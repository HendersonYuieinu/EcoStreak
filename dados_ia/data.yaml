# Indica que o YOLO deve procurar as pastas a partir do local deste arquivo
path: .

# Caminho para as imagens de treino e validação
# Lista com os nomes de cada categoria
train: train/images
val: valid/images
test: test/images

# Número total de categorias que a IA vai aprender
nc: 6
names: ['cardboard', 'glass', 'metal', 'organic', 'paper', 'plastic']